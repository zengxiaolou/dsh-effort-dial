<!doctype html><html data-ds-dark-theme="true"><head><meta charset="utf-8">
<style>
:root{--dsw-alias-bg-layer-1:#181c25;--dsw-alias-border-l2:rgba(122,132,152,.34);--dsw-alias-border-l3:rgba(122,132,152,.55);--dsw-alias-label-primary:#e6ebf5;--dsw-alias-label-secondary:#98a2b6;--dsw-alias-label-tertiary:#7b8496;--dsw-alias-brand-primary:#5b8cff;--dsw-alias-state-error-primary:#e5484d}
body{background:#0b0d12;color:#e6ebf5;font:12px/1.6 monospace;padding:16px}
</style></head><body>
<div id="host" style="margin-bottom:16px"></div>
<pre id="out">pending…</pre>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+l)};window.onunhandledrejection=function(e){window.__errors.push('rej:'+(e.reason&&e.reason.message||e.reason))}</script>
<script src="file:///tmp/rt/react.development.js"></script>
<script src="file:///tmp/rt/react-dom.development.js"></script>
<script>var F=null;window.__ModuleLoader__={load:function(o){F=o.factory}}</script>
<script src="file:///Users/ruler/Documents/work/dsh-effort-dial/lib/client.js"></script>
<script>
(async function(){
  const lines=[]; let fails=0
  const ok=(cond,msg)=>{ lines.push((cond?'PASS':'FAIL')+'  '+msg); if(!cond) fails++ }
  try{
    const mod=F(function(id){ if(id==='react') return React; throw new Error('unexpected require '+id) })
    let Comp=null, SettingsComp=null
    const TIERS=[['minimal','Minimal'],['low','Low'],['medium','Medium'],['high','High'],['xhigh','XHigh'],['max','Max']]
    const efforts=TIERS.map(([id,name])=>({id,name}))
    let snap={status:'ready',current:{provider:'p',model:'m',reasoningEffort:'low'},
      groups:[{id:'p',models:[{id:'m',name:'Model',reasoning:{efforts}}]}]}
    const listeners=new Set()
    function setEffort(id){
      snap=Object.assign({},snap,{current:Object.assign({},snap.current,{reasoningEffort:id})})
      listeners.forEach(function(fn){fn()})
    }
    let selectCalls=[]
    let mode='ok'
    const directory={
      store:{ getSnapshot:()=>snap, subscribe:fn=>{listeners.add(fn);return()=>listeners.delete(fn)} },
      load:()=>Promise.resolve(),
      select:(sel)=>{ selectCalls.push(sel)
        if(mode==='fail') return Promise.resolve({ok:false,error:{message:'denied-by-host'}})
        setTimeout(function(){ setEffort(sel.reasoningEffort) },0)
        return Promise.resolve({ok:true})
      }
    }
    let scopeCalls=0
    const posts=[]
    let bandEcho={enabled:false,min:'high',max:'max'}
    let lastEcho=null
    let routesEcho={routine:null,deep:null}
    window.fetch=function(url,opts){
      const u=String(url)
      if(u.indexOf('/effort-dial/state')===0){
        const b=bandEcho
        return Promise.resolve({ok:true,json:()=>Promise.resolve({ok:true,tiers:['minimal','low','medium','high','xhigh','max'],global:b,band:Object.assign({session:true},b),last:lastEcho,routes:routesEcho})})
      }
      if(u.indexOf('/effort-dial/band')===0){
        const body=JSON.parse((opts&&opts.body)||'{}')
        posts.push(body)
        if(body.routes){ Object.assign(routesEcho, body.routes) }
        if(typeof body.enabled==='boolean') bandEcho.enabled=body.enabled
        if(body.min) bandEcho.min=body.min
        if(body.max) bandEcho.max=body.max
        return Promise.resolve({ok:true,json:()=>Promise.resolve({ok:true})})
      }
      return Promise.resolve({ok:false,json:()=>Promise.resolve(null)})
    }
    const ctx={
      inject:(deps,cb)=>cb({modelDirectories:{directoryFor:()=>directory},sessions:{scope:()=>{ scopeCalls++; return scopeCalls>2?{}:undefined }}}),
      slots:{inject:(n,cb)=>cb(),register:(o,c)=>{ if(o&&o.name==='settings.section'){SettingsComp=c}else{Comp=c} return()=>{} }},
      effect(){}
    }
    mod.apply(ctx)
    ok(typeof Comp==='function','组件注册成功')

    const host=document.getElementById('host')
    const root=ReactDOM.createRoot(host)
    // 不给 props.sessionId，只靠 DOM 兜底 + 轮询重试
    var marker=document.createElement('div'); marker.setAttribute('data-conversation-session','s-dom'); document.body.appendChild(marker)
    const sessionsSvc={scope:()=>{ scopeCalls++; return scopeCalls>2?{}:undefined }}
    root.render(React.createElement(Comp,{directories:{directoryFor:()=>directory},sessions:sessionsSvc}))
    await new Promise(r=>setTimeout(r,1500))

    const el=host.querySelector('.ed')
    ok(!!el,'渲染出 .ed 胶囊')
    const ticks=host.querySelectorAll('.ed-tick')
    ok(ticks.length===6,'刻度数量 6，实际 '+ticks.length)
    const thumbQ=()=>host.querySelector('.ed-thumb')
    const thumb=thumbQ()
    const slot=host.querySelector('.ed-slot')
    ok(!!thumb && !!slot,'滑块与 slot 都存在')
    // 时间序列采样：定位初始位置何时被写成 0
    const trace=[]
    for (const delay of [0,50,150,300,450]) {
      await new Promise(r2=>setTimeout(r2, delay===0?0:delay - (trace.length? [0,50,150,300,450][trace.length-1]:0)))
      trace.push(delay+'ms:'+host.querySelector('.ed-thumb').style.left)
    }
    lines.push('trace  '+trace.join('  '))
    lines.push('dbg count='+((window.__dbg||[]).length))
    lines.push('dbg first: '+((window.__dbg||[]).slice(0,4).join(' | ')))
    lines.push('dbg last: '+((window.__dbg||[]).slice(-6).join(' | ')))
    window.dispatchEvent(new Event('resize'))
    await new Promise(r2=>setTimeout(r2,30))
    lines.push('after resize: '+host.querySelector('.ed-thumb').style.left)
    const lbl=host.querySelector('.ed-label').textContent
    lines.push('label now: '+lbl)
    const pct=parseFloat(thumbQ().style.left)
    ok(Math.abs(pct-20)<0.5,'low 档滑块应 20%，实际 '+pct)
    ok(host.querySelector('.ed-label').textContent==='Low','标签应为 Low，实际 '+host.querySelector('.ed-label').textContent)
    ok(!!host.querySelector('canvas.ed-fx'),'canvas 辐射层存在')

    // 拖动到 60% → 应提交 high
    const r=slot.getBoundingClientRect()
    const px=(f)=>r.left+f*r.width
    const ev=(t,x)=>new PointerEvent(t,{clientX:x,clientY:r.top+r.height/2,bubbles:true,pointerId:1,button:0,buttons:1,isPrimary:true})
    const track=host.querySelector('.ed-track')
    track.dispatchEvent(ev('pointerdown',px(0.2)))
    track.dispatchEvent(ev('pointermove',px(0.6)))
    await new Promise(r2=>setTimeout(r2,40))
    track.dispatchEvent(ev('pointerup',px(0.6)))
    await new Promise(r2=>setTimeout(r2,80))
    ok(selectCalls.length===1,'拖动一次只提交一次，实际 '+selectCalls.length)
    ok(selectCalls[0] && selectCalls[0].reasoningEffort==='high','提交档位应为 high，实际 '+(selectCalls[0]&&selectCalls[0].reasoningEffort))
    ok(Math.abs(parseFloat(thumbQ().style.left)-60)<0.6,'提交后滑块应 60%，实际 '+host.querySelector('.ed-thumb').style.left)
    ok(host.querySelector('.ed-label').textContent==='High','提交后标签应为 High，实际 '+host.querySelector('.ed-label').textContent)

    // 失败路径：宿主拒绝 → 必须弹回旧档并显示错误
    mode='fail'
    const before=thumbQ().style.left
    track.dispatchEvent(ev('pointerdown',px(0.6)))
    track.dispatchEvent(ev('pointermove',px(0.1)))
    await new Promise(r2=>setTimeout(r2,40))
    track.dispatchEvent(ev('pointerup',px(0.1)))
    await new Promise(r2=>setTimeout(r2,120))
    const after=thumbQ().style.left
    ok(host.querySelector('.ed').getAttribute('data-error')==='true','被拒绝时应有 data-error')
    ok((host.querySelector('.ed').getAttribute('title')||'').includes('denied-by-host'),'错误原文应出现在 title')
    ok(Math.abs(parseFloat(after)-60)<1.5,'被拒绝后滑块应弹回 60%，实际 '+after+'（松手前 '+before+'）')
    ok(host.querySelector('.ed-label').textContent==='High','被拒绝后标签应回到 High，实际 '+host.querySelector('.ed-label').textContent)

    // ── 场景：拖动过程中父组件高频重渲染（模拟输入框/流式输出）──
    const host2=document.createElement('div'); host2.id='host2'; document.body.insertBefore(host2, document.getElementById('out'))
    const root2=ReactDOM.createRoot(host2)
    function Bouncer(props){
      const [t,setT]=React.useState(0)
      React.useEffect(function(){ const i=setInterval(function(){setT(function(x){return x+1})},50); return function(){clearInterval(i)} },[])
      return React.createElement(props.Child, Object.assign({}, props.childProps, {tick:t}))
    }
    mode='ok'
    const props2={directories:{directoryFor:()=>directory},sessions:{scope:()=>({})},sessionId:'s1'}
    root2.render(React.createElement(Bouncer,{Child:Comp, childProps:props2}))
    await new Promise(r2=>setTimeout(r2,120))
    const el2=host2.querySelector('.ed')
    ok(!!el2,'第二个实例渲染')
    const track2=host2.querySelector('.ed-track')
    const slot2=host2.querySelector('.ed-slot')
    const r2b=slot2.getBoundingClientRect()
    const px2=f=>r2b.left+f*r2b.width
    const ev2=(t,x)=>new PointerEvent(t,{clientX:x,clientY:r2b.top+r2b.height/2,bubbles:true,pointerId:2,button:0,buttons:1,isPrimary:true})
    track2.dispatchEvent(ev2('pointerdown',px2(0.5)))
    track2.dispatchEvent(ev2('pointermove',px2(0.7)))
    const samples=[]
    for(let i=0;i<8;i++){ await new Promise(r2=>setTimeout(r2,50)); samples.push(host2.querySelector('.ed-thumb').style.left) }
    const nums=samples.map(v=>parseFloat(v))
    const min=Math.min.apply(null,nums), max=Math.max.apply(null,nums)
    ok(Math.abs(parseFloat(samples[samples.length-1])-70)<1.5,'拖动中父级重渲染时仍应跟手到 70%，样本 '+samples.join(' '))
    track2.dispatchEvent(ev2('pointerup',px2(0.7)))
    await new Promise(r2=>setTimeout(r2,200))

    // ── 辐射只在 Max 档绘制 ──
    const pxSum = (sel)=>{
      const cv=host.querySelector(sel+' canvas.ed-fx')
      if(!cv) return -1
      const ctx=cv.getContext('2d')
      const d=ctx.getImageData(0,0,Math.max(1,cv.width),Math.max(1,cv.height)).data
      let sum=0; for(let i=3;i<d.length;i+=4) sum+=d[i]
      return sum
    }
    // 当前档位 high（非 max）→ 画布应为空
    const sumHigh=pxSum('.ed')
    const fxHigh=host.querySelector('.ed').getAttribute('data-fx')
    ok(fxHigh==='off'&&sumHigh===0,'high 档 data-fx=off 且无绘制（alpha '+sumHigh+'）')
    // ── 配置页与生效性 ──
    ok(typeof SettingsComp==='function','设置页组件注册成功')
    const sHost=document.createElement('div'); document.body.insertBefore(sHost, document.getElementById('out'))
    const sRoot=ReactDOM.createRoot(sHost)
    sRoot.render(React.createElement(SettingsComp,{}))
    await new Promise(r2=>setTimeout(r2,80))
    const txt=sHost.textContent||''
    ok(txt.includes('动画')&&txt.includes('Auto')&&txt.includes('轨道宽度'),'设置页三项都在：'+txt.slice(0,40))
    const btns=sHost.querySelectorAll('button')
    ok(btns.length>=2,'设置页有开关按钮，数量 '+btns.length)
    btns[0].dispatchEvent(new MouseEvent('click',{bubbles:true}))
    await new Promise(r2=>setTimeout(r2,60))
    const stored=JSON.parse(localStorage.getItem('dsh-effort-dial.config.v1')||'{}')
    ok(stored.animate===false,'点击后动画开关持久化为 false，实际 '+JSON.stringify(stored))
    const dialEl=host.querySelector('.ed')
    ok(dialEl.getAttribute('data-animate')==='false','滑杆响应配置：data-animate=false')
    const range=sHost.querySelector('input[data-role="track-width"]')
    if(range){
      const setNative=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set
      setNative.call(range,'180')
      range.dispatchEvent(new Event('input',{bubbles:true}))
      await new Promise(r2=>setTimeout(r2,80))
      const st2=JSON.parse(localStorage.getItem('dsh-effort-dial.config.v1')||'{}')
      ok(st2.trackWidth===180,'拖动宽度后持久化为 180，实际 '+JSON.stringify(st2))
      const tr=host.querySelector('.ed-track')
      ok(tr.getBoundingClientRect().width>150,'滑杆轨道宽度已生效，实测 '+Math.round(tr.getBoundingClientRect().width))
    } else { ok(false,'找不到宽度滑块') }

    // ── 模型路由配置 ──
    const routeIn=sHost.querySelector('input[data-role="route-deep"]')
    ok(!!routeIn,'设置页有 deep 路由输入框')
    const setNative3=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set
    setNative3.call(routeIn,'topen/deepseek-v4-pro-0813')
    routeIn.dispatchEvent(new Event('input',{bubbles:true}))
    await new Promise(r2=>setTimeout(r2,60))
    const saveBtn=sHost.querySelector('button[data-role="route-deep-save"]')
    ok(!!saveBtn,'有 deep 保存按钮')
    saveBtn.dispatchEvent(new MouseEvent('click',{bubbles:true}))
    await new Promise(r2=>setTimeout(r2,120))
    ok(posts.some(p=>p.routes&&p.routes.deep&&p.routes.deep.model==='deepseek-v4-pro-0813'),'保存后提交 deep 路由，posts='+JSON.stringify(posts.filter(p=>p.routes)))
    ok(routesEcho.deep&&routesEcho.deep.provider==='topen','宿主侧记录 provider=topen')
    // ── Auto 区间：A 只做开关；上下限在设置页用滑块调 ──
    const aBtn=host.querySelector('.ed-auto')
    ok(!!aBtn,'A 按钮存在（不依赖 auto 档广告）')
    aBtn.dispatchEvent(new MouseEvent('click',{bubbles:true}))
    await new Promise(r2=>setTimeout(r2,120))
    ok(posts.some(p=>p.enabled===true),'点 A 向宿主提交 enabled=true，posts='+JSON.stringify(posts.slice(-2)))
    ok(!!host.querySelector('.ed-band'),'轨道出现区间高亮')
    ok(!!host.querySelector('.ed-auto'),'自动模式下仍保留小圆钮 A')
    // 点标签关闭自动
    host.querySelector('.ed-label').dispatchEvent(new MouseEvent('click',{bubbles:true}))
    await new Promise(r2=>setTimeout(r2,120))
    ok(posts.some(p=>p.enabled===false),'点击标签关闭自动，posts='+JSON.stringify(posts.slice(-1)))
    // 重新开启，继续后面的滑块与拖动断言
    bandEcho.enabled=true
    window.dispatchEvent(new Event('dsh-effort-dial:band'))
    await new Promise(r2=>setTimeout(r2,120))
    const bandMin=sHost.querySelector('input[data-role="band-min"]')
    const bandMax=sHost.querySelector('input[data-role="band-max"]')
    ok(!!bandMin&&!!bandMax,'设置页有下限/上限滑块')
    const setNative2=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set
    setNative2.call(bandMin,'2')            // medium
    bandMin.dispatchEvent(new Event('input',{bubbles:true}))
    await new Promise(r2=>setTimeout(r2,80))
    setNative2.call(bandMax,'5')            // max
    bandMax.dispatchEvent(new Event('input',{bubbles:true}))
    await new Promise(r2=>setTimeout(r2,80))
    ok(posts.some(p=>p.min==='medium'),'下限滑块提交 medium，posts='+JSON.stringify(posts.slice(-2)))
    ok(posts.some(p=>p.max==='max'),'上限滑块提交 max')
    const lblEl=host.querySelector('.ed-label')
    ok(lblEl.textContent.indexOf('Auto')<0,'标签不含 Auto 字样：'+lblEl.textContent)
    ok(lblEl.textContent.indexOf('→')>=0,'标签显示区间箭头：'+lblEl.textContent)
    ok(lblEl.scrollWidth<=lblEl.clientWidth+1,'标签未被截断（scroll '+lblEl.scrollWidth+' / client '+lblEl.clientWidth+'）')
    ok(lblEl.textContent.indexOf('medium')>=0&&lblEl.textContent.indexOf('max')>=0,'标签里同时出现上下限：'+lblEl.textContent)
    // ── 特效分级：xhigh 有、max 更多、其余没有 ──
    const setLevel=(id)=>{
      bandEcho.enabled=false; lastEcho=null
      snap=Object.assign({},snap,{current:Object.assign({},snap.current,{reasoningEffort:id})})
      listeners.forEach(fn=>fn())
    }
    setLevel('medium'); await new Promise(r2=>setTimeout(r2,250))
    const sumMedium=pxSum('.ed'); const attrMedium=host.querySelector('.ed').getAttribute('data-fx')
    setLevel('xhigh'); await new Promise(r2=>setTimeout(r2,300))
    const sumXHigh=pxSum('.ed'); const attrXHigh=host.querySelector('.ed').getAttribute('data-fx')
    setLevel('max'); await new Promise(r2=>setTimeout(r2,300))
    const sumMax2=pxSum('.ed'); const attrMax=host.querySelector('.ed').getAttribute('data-fx')
    ok(sumMedium===0&&attrMedium==='off','medium 无特效（data-fx=off，alpha 0）')
    ok(sumXHigh>0&&attrXHigh==='xhigh','xhigh 有特效（data-fx=xhigh，alpha '+sumXHigh+'）')
    ok(sumMax2>sumXHigh,'max 特效强于 xhigh（'+sumMax2+' > '+sumXHigh+'）')
    ok(attrMax==='max','max 档 data-fx=max')
    setLevel('high'); await new Promise(r2=>setTimeout(r2,200))
    bandEcho.enabled=true
    window.dispatchEvent(new Event('dsh-effort-dial:band'))
    await new Promise(r2=>setTimeout(r2,150))
    // ── 实时显示 Auto 实际跑的档位 ──
    lastEcho={level:'xhigh',at:Date.now()}
    window.dispatchEvent(new Event('dsh-effort-dial:band'))
    await new Promise(r2=>setTimeout(r2,150))
    const lblLive=host.querySelector('.ed-label').textContent
    ok(lblLive.indexOf('xhigh')>=0,'标签显示上一轮实际档位：'+lblLive)
    ok(lblLive.indexOf('Auto')<0,'实际档位标签也不含 Auto：'+lblLive)
    const thumbLive=host.querySelector('.ed-thumb').style.left
    ok(Math.abs(parseFloat(thumbLive)-80)<1.5,'鲸鱼娘定位到实际档位 xhigh=80%，实际 '+thumbLive)
    const sumX=pxSum('.ed')
    ok(sumX>0,'xhigh 档有精简特效（alpha 合计 '+sumX+'）')
    lastEcho={level:'max',at:Date.now()}
    window.dispatchEvent(new Event('dsh-effort-dial:band'))
    await new Promise(r2=>setTimeout(r2,250))
    const thumbMax=host.querySelector('.ed-thumb').style.left
    ok(Math.abs(parseFloat(thumbMax)-100)<1.5,'实际档位到 max 时鲸鱼娘到 100%，实际 '+thumbMax)
    const sumMax=pxSum('.ed')
    ok(sumMax>0,'实际档位是 max 时开始绘制辐射（alpha 合计 '+sumMax+'）')
    lastEcho=null
    window.dispatchEvent(new Event('dsh-effort-dial:band'))
    await new Promise(r2=>setTimeout(r2,120))
    // 拖动退出自动
    const trk3=host.querySelector('.ed-track'), slot3=host.querySelector('.ed-slot')
    const r3=slot3.getBoundingClientRect()
    const ev3=(t,x)=>new PointerEvent(t,{clientX:x,clientY:r3.top+r3.height/2,bubbles:true,pointerId:3,button:0,buttons:1,isPrimary:true})
    trk3.dispatchEvent(ev3('pointerdown',r3.left+0.5*r3.width))
    trk3.dispatchEvent(ev3('pointermove',r3.left+0.6*r3.width))
    trk3.dispatchEvent(ev3('pointerup',r3.left+0.6*r3.width))
    await new Promise(r2=>setTimeout(r2,150))
    ok(posts.some(p=>p.enabled===false),'拖动后提交 enabled=false')
    ok(!host.querySelector('.ed-band'),'区间高亮消失')
  }catch(e){ ok(false,'脚本异常: '+e.message) }
  if(window.__errors.length) ok(false,'未捕获错误: '+window.__errors.join(' | '))
  lines.push(fails===0?'\nALL PASS':' \nFAILURES: '+fails)
  document.getElementById('out').textContent=lines.join('\n')
  document.title=fails===0?'ALLPASS':'FAIL'+fails
})()
</script></body></html>
